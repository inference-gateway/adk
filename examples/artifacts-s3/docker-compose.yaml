---
services:
  # RustFS is an S3-compatible object store: https://github.com/rustfs/rustfs
  # API on 9000, web console on 9001. The ADK creates the 'artifacts' bucket
  # on startup when it is missing.
  rustfs:
    image: rustfs/rustfs:1.0.4
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # RustFS Console
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    volumes:
      - rustfs-data:/data
    networks:
      - a2a-network
    depends_on:
      volume-permission-helper:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:9000/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # RustFS runs as UID/GID 10001 (10001:10001) - named volumes must be writable
  # by that user (see the RustFS docker-compose-simple.yml reference)
  volume-permission-helper:
    image: alpine
    volumes:
      - rustfs-data:/data
    command: sh -c "chown -R 10001:10001 /data && echo 'Volume Permissions fixed' && exit 0"
    restart: "no"

  server:
    build:
      context: ../..
      dockerfile: examples/Dockerfile.server
      args:
        AGENT_NAME: artifacts-s3-agent
        AGENT_DESCRIPTION: An agent that creates and serves artifacts using S3-compatible object storage (RustFS)
        AGENT_VERSION: 0.1.0
        EXAMPLE_PATH: examples/artifacts-s3
        COMPONENT: server
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      A2A_SERVER_PORT: 8080
      A2A_DEBUG: true
      A2A_CAPABILITIES_STREAMING: false
      A2A_CAPABILITIES_PUSH_NOTIFICATIONS: false
      A2A_ARTIFACTS_ENABLED: true
      A2A_ARTIFACTS_STORAGE_PROVIDER: s3
      A2A_ARTIFACTS_STORAGE_ENDPOINT: rustfs:9000
      A2A_ARTIFACTS_STORAGE_ACCESS_KEY: rustfsadmin
      A2A_ARTIFACTS_STORAGE_SECRET_KEY: rustfsadmin
      A2A_ARTIFACTS_STORAGE_BUCKET_NAME: artifacts
      A2A_ARTIFACTS_STORAGE_USE_SSL: "false"
      A2A_ARTIFACTS_SERVER_PORT: 8081
      A2A_ARTIFACTS_SERVER_HOST: server
      # To let clients download artifacts directly from RustFS instead of the
      # artifacts server, set A2A_ARTIFACTS_ARTIFACTS_STORAGE_BASE_URL to
      # http://rustfs:9000 and give the bucket an anonymous download policy
      # (direct downloads bypass the artifacts server, so access control must
      # be handled at the storage level)
    networks:
      - a2a-network

  client:
    build:
      context: ../..
      dockerfile: examples/Dockerfile.client
      args:
        EXAMPLE_PATH: examples/artifacts-s3
        COMPONENT: client
    depends_on:
      server:
        condition: service_started
    environment:
      SERVER_URL: http://server:8080
      ARTIFACTS_URL: http://server:8081
      DOWNLOADS_DIR: /app/downloads
    volumes:
      - ./client/downloads:/app/downloads
    command: sh -c "sleep 15 && /app/client"
    networks:
      - a2a-network

  a2a-debugger:
    image: ghcr.io/inference-gateway/a2a-debugger:latest
    pull_policy: always
    entrypoint:
      - /a2a
      - --server-url
      - http://server:8080
    networks:
      - a2a-network
    profiles:
      - manual

volumes:
  rustfs-data:

networks:
  a2a-network:
    driver: bridge