---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          args: --help

      - name: Install Mockgen
        run: go install go.uber.org/mock/mockgen@v0.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 'lts/*'

      - name: Install prettier
        run: npm install -g prettier

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Format Go files
        run: find . -name '*.go' -exec gofmt -w {} \;

      - name: Format markdown files
        run: find . -name '*.md' -exec prettier -w {} \;

      - name: Lint markdown examples
        run: markdownlint 'examples/**/*.md'

      - name: Tidy Go modules
        run: find . -name 'go.mod' -execdir go mod tidy \;

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - name: Run generate
        run: |
          task a2a:generate-types
          go run ./cmd/generate-providers

      - name: Format generated markdown
        run: find . -name '*.md' -exec prettier -w {} \;

      - name: Check dirty
        run: git diff --exit-code

      - name: Run Lint
        run: golangci-lint run

      - name: Run Lint (example modules)
        run: for d in $(find examples -name go.mod -exec dirname {} \;); do (cd "$d" && golangci-lint run --config "$GITHUB_WORKSPACE/.golangci.yml" ./...) || exit 1; done

      - name: Build
        run: go build .

      - name: Test
        run: go test -v ./...

  tck:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Checkout A2A TCK
        uses: actions/checkout@v7.0.1
        with:
          repository: a2aproject/a2a-tck
          ref: 263b9cfaf16a554bdfb166a7ba5b67716e946349
          path: a2a-tck
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Start TCK system under test
        working-directory: examples/tck-sut
        run: |
          go build -o tck-sut .
          ./tck-sut &
          curl -sf --retry 30 --retry-connrefused --retry-delay 1 http://localhost:9999/health

      - name: Run TCK (JSON-RPC, MUST)
        working-directory: a2a-tck
        run: uv run ./run_tck.py --sut-host http://localhost:9999 --transport jsonrpc --level must -- --deselect tests/compatibility/core_operations/test_artifacts.py
