---
version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /examples/*/client
      - /examples/*/server
      - /examples/*/*/client
      - /examples/*/*/server
      - /examples/tck-sut
    schedule:
      interval: weekly
    groups:
      gomod:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
